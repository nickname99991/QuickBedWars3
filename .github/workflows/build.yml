name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Build
        run: |
          gradle-2.14.1/bin/gradle clean build --no-daemon

      - name: Find JAR
        run: |
          echo "Searching for JAR..."

          find . -type f -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print

          JAR=$(find . -type f -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: NO JAR FOUND"
            exit 1
          fi

          echo "FOUND:"
          echo "$JAR"

          mkdir -p release
          cp "$JAR" release/QuickBedWars.jar

          echo "FINAL FILE:"
          ls -lh release/QuickBedWars.jar

      - name: Upload ONLY JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars-Mod
          path: release/QuickBedWars.jar
          if-no-files-found: error
