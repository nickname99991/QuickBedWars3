name: Build QuickBedWars

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Build mod
        run: |
          ./gradle-2.14.1/bin/gradle clean build --no-daemon

      - name: Check JAR contents
        run: |
          echo "=== Built JARs ==="
          find . -type f -path "*/build/libs/*.jar" -print

          echo "=== Checking for QuickBedWars.class ==="
          JAR=$(find . -type f -path "*/build/libs/*.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was produced."
            exit 1
          fi

          jar tf "$JAR" | grep "QuickBedWars.class"

          echo "=== JAR CONTENTS ==="
          jar tf "$JAR"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
