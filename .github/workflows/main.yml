name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Find project ZIP
        run: |
          echo "Searching for project ZIP..."

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            ! -name "gradle-2.14.1-bin.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found project ZIP:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project

          unzip -q "$PROJECT_ZIP" -d project

          echo "Project extracted."

      - name: Find Gradle project
        run: |
          BUILD_FILE=$(find project \
            -type f \
            -name "build.gradle" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"

            echo "Files inside project:"
            find project -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix ClientRegistry
        run: |
          FILE=$(find project \
            -type f \
            -name "QuickBedWars.java" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: QuickBedWars.java not found!"

            find project -type f -name "*.java" | sort

            exit 1
          fi

          echo "Java file:"
          echo "$FILE"

          sed -i \
            's/import net\.minecraftforge\.client\.ClientRegistry;/import net.minecraftforge.fml.client.registry.ClientRegistry;/' \
            "$FILE"

          echo "Checking ClientRegistry:"
          grep "ClientRegistry" "$FILE"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"

          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" \
            clean build \
            --no-daemon

      - name: Find built JAR
        run: |
          echo "Searching for built JAR..."

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: Mod JAR not found!"

            echo "Build files:"
            find "$PROJECT_DIR/build" -type f | sort

            exit 1
          fi

          echo "Found mod JAR:"
          echo "$JAR"

          cp "$JAR" "$GITHUB_WORKSPACE/QuickBedWars.jar"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars
          path: QuickBedWars.jar
          if-no-files-found: error
