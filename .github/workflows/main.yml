name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -name "*.zip" ! -name "gradle-2.14.1-bin.zip" -print -quit)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Project
        run: |
          BUILD=$(find project -type f -name "build.gradle" -print -quit)
          DIR=$(dirname "$BUILD")
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Fix ClientRegistry
        run: |
          FILE=$(find project -type f -name "QuickBedWars.java" -print -quit)
          sed -i 's/import net\.minecraftforge\.client\.ClientRegistry;/import net.minecraftforge.fml.client.registry.ClientRegistry;/' "$FILE"

      - name: Build
        run: |
          cd "$DIR"
          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" clean build --no-daemon

      - name: Prepare ONLY JAR
        run: |
          JAR=$(find "$DIR/build/libs" -type f -name "*.jar" ! -name "*sources*" ! -name "*dev*" -print -quit)

          echo "Found JAR:"
          echo "$JAR"

          rm -rf release
          mkdir release
          cp "$JAR" release/QuickBedWars.jar

          echo "Release contents:"
          ls -lh release/

      - name: Upload ONLY JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars-Mod
          path: release/QuickBedWars.jar
          if-no-files-found: error
