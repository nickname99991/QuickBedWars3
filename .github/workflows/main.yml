name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Find Project ZIP
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            ! -name "gradle-2.14.1-bin.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found project ZIP: $ZIP"

      - name: Extract Project
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/project"

      - name: Find Gradle Project
        run: |
          BUILD_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "build.gradle" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            find "$GITHUB_WORKSPACE/project" -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Fix ClientRegistry
        run: |
          FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "QuickBedWars.java" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: QuickBedWars.java not found"
            exit 1
          fi

          sed -i \
            's/import net\.minecraftforge\.client\.ClientRegistry;/import net.minecraftforge.fml.client.registry.ClientRegistry;/' \
            "$FILE"

          echo "Java file:"
          echo "$FILE"

          grep "ClientRegistry" "$FILE"

      - name: Build Mod
        run: |
          cd "$PROJECT_DIR"

          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" \
            clean build \
            --no-daemon

      - name: Find Built JAR
        run: |
          echo "Searching for JAR..."

          find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            -ls

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was created!"
            exit 1
          fi

          echo "JAR FOUND:"
          echo "$JAR"

          echo "JAR SIZE:"
          ls -lh "$JAR"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$JAR" \
            "$GITHUB_WORKSPACE/release/QuickBedWars.jar"

      - name: Verify Release
        run: |
          echo "Release folder:"
          find "$GITHUB_WORKSPACE/release" \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          echo "Final JAR:"
          file "$GITHUB_WORKSPACE/release/QuickBedWars.jar"

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars-Mod
          path: release/QuickBedWars.jar
          if-no-files-found: error
          retention-days: 7
